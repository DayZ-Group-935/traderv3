<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>935 Trading Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a120c;
      --surface: #2a1f16;
      --surface-2: #3d2e22;
      --border: #5a4636;
      --text: #f0e6d8;
      --text-dim: #c4b09a;
      --accent: #c9a227;
      --accent-hover: #e0b84a;
      --green: #7a9a4a;
      --orange: #d48a3a;
      --blue: #8aa4b8;
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: inherit; }

    body {
      margin: 0;
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      background: #0f0c09;
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      background: linear-gradient(180deg, #2a1f16 0%, #1a120c 100%);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .header {
      text-align: center;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    .header img {
      width: 100%;
      height: auto;
      display: block;
    }
    .header a { text-decoration: none; }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-dim);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #1a120c;
    }

    .content {
      padding: 12px 16px 120px;
      max-width: 100%;
    }

    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 12px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--text); }
    .breadcrumb .sep { opacity: 0.4; }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .item-btn, .cat-btn {
      padding: 14px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13.5px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .item-btn:active, .cat-btn:active { transform: scale(0.97); background: #252525; }
    .item-btn.role-turnin { border-color: var(--blue); }

    .summary {
      margin-top: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      position: sticky;
      bottom: 70px;
      z-index: 50;
    }
    .summary-header {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .summary-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }
    .summary-item:last-child { border-bottom: none; }
    .summary-item .name { flex: 1; }
    .summary-item .price { color: var(--text-dim); margin: 0 10px; white-space: nowrap; }
    .summary-item .controls { display: flex; gap: 6px; }
    .summary-item button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .remove-one { background: var(--orange); color: #000; }
    .remove-all { background: #e53935; color: #fff; }

    .roles-section {
      margin-top: 20px;
    }
    .roles-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-dim);
    }
    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .role-btn {
      padding: 10px 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 11.5px;
      cursor: pointer;
      text-align: center;
      min-height: 42px;
    }
    .role-btn.active {
      background: #3d2e22;
      border-color: var(--accent);
      color: var(--accent);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }
    .bottom-bar button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #calculateBtn { background: var(--green); color: #1a120c; }
    #clearAllBtn { background: #a84a3a; color: #fff; }
    #clearRolesBtn { background: #5a4636; color: #f0e6d8; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      max-width: 90%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    .empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 14px; }

    .kit-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .kit-box {
      background: var(--surface);
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .kit-box h3 { margin: 0 0 12px; font-size: 16px; }
    .kit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .kit-row label { flex: 0 0 100px; color: var(--text-dim); }
    .kit-row select {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
    }
    .kit-token {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--accent);
    }
    .kit-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .kit-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .kit-save { background: var(--green); color: #1a120c; }
    .kit-cancel { background: #5a4636; color: #f0e6d8; }
    .kit-summary-box {
      margin-top: 12px;
      padding: 10px;
      background: var(--surface-2);
      border-radius: 8px;
      font-size: 12px;
      border: 1px dashed var(--border);
    }
    .kit-summary-box h4 { margin: 0 0 6px; font-size: 13px; }

    @media (min-width: 600px) {
      .roles-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

    // Sort all item arrays alphabetically
    function sortItems(node) {
      if (Array.isArray(node)) {
        node.sort((a, b) => a.name.localeCompare(b.name));
      } else if (node && typeof node === "object") {
        Object.keys(node).forEach(k => {
          if (!k.startsWith("_")) sortItems(node[k]);
        });
      }
    }
    sortItems(buyitems);

    
    // Normalize every buy item with inStock / salePrice
    function normalizeItems(node) {
      if (Array.isArray(node)) {
        node.forEach(item => {
          if (typeof item === "object" && item.name) {
            if (item.inStock === undefined) item.inStock = true;
            if (item.salePrice === undefined) item.salePrice = null;
          }
        });
      } else if (node && typeof node === "object") {
        Object.keys(node).forEach(k => {
          if (!k.startsWith("_")) normalizeItems(node[k]);
        });
      }

    function getDiscountedPrice(name, base) {
      let price = base;
      activeRoles.forEach(role => {
        const r = roles[role];
        if (r.discounts && r.discounts[name]) {
          price = Math.min(price, base * (1 - r.discounts[name] / 100));
        }
        if (r.bonuses && r.bonuses[name]) {
          price = r.bonuses[name];
        }
      });
      return price;
    }

    function getBibleTotal(qty) {
      if (qty === 1) return 10000;
      if (qty === 2) return 30000;
      if (qty === 3) return 40000;
      if (qty >= 4) return 60000;
      return 10000 * qty;
    }

    function itemDisplayName(item) {
      const name = item.salePrice != null ? `*${item.name}*` : item.name;
      return item.inStock === false ? name : name;

    function styleOutOfStock(btn, item) {
      if (item.inStock === false) {
        btn.style.textDecoration = "line-through";
        btn.style.opacity = "0.5";
      }
    }

    function getCategoryForItem(name) {
      const map = {
        "Aug AX":"Weapons","Crossbow":"Weapons","DMR":"Weapons","KAM":"Weapons","M4A1":"Weapons","R12":"Weapons","SCAR-H":"Weapons","SCAR-L":"Weapons","Tundra":"Weapons","Combat Knife":"Weapons",
        "60Rd C-Mag":"Magazines","40Rd C-Mag":"Magazines","20Rd DMR Mag":"Magazines","20Rd SCAR Mag":"Magazines","75Rd KAM Drum Mag":"Magazines","10Rd VSD Mag":"Magazines",
        "5.56x45":"Ammo","308 WIN":"Ammo","7.62x39":"Ammo","12GA Buck":"Ammo","Crossbow Bolts":"Ammo",
        "Starlight NV":"Optics","Kazuar NV":"Optics","Holo Optic":"Optics","Red Dot (Baraka)":"Optics","ATOG 6x":"Optics","MKII Optic":"Optics","BUIS Optic":"Optics","Kobra Sights":"Optics","Hunting Scope":"Optics","PU Scope":"Optics","PSO-1 Scope":"Optics",
        "M4 Suppressor":"Attachments","AK Supressor":"Attachments","Bottle Suppressor":"Attachments",
        "Ghillie Rifle Wrap":"Clothing"
      };
      return map[name] || "Other";
    }

    function flattenBuyItems(node, out = []) {
      if (Array.isArray(node)) {
        node.forEach(item => out.push(item));
      } else if (node && typeof node === "object") {
        Object.values(node).forEach(v => flattenBuyItems(v, out));
      }
      return out;
    }

    function renderBuy() {
      const grid = document.getElementById("buyGrid");
      const bc = document.getElementById("buyBreadcrumb");
      grid.innerHTML = "";

      if (searchTerm) {
        bc.innerHTML = '<span>Search results</span>';
        const all = flattenBuyItems(buyitems);
        let matches = all.filter(item => item.name.toLowerCase().includes(searchTerm));

        // Weapon compatibility: if search matches a weapon, add its attachments
        const term = searchTerm.toLowerCase();
        let compatNames = [];
        Object.keys(weaponCompat).forEach(key => {
          if (key.includes(term) || term.includes(key)) compatNames = compatNames.concat(weaponCompat[key]);
        });
        if (compatNames.length) {
          const extra = all.filter(item => compatNames.includes(item.name));
          const seen = new Set(matches.map(m => m.name));
          extra.forEach(e => { if (!seen.has(e.name)) matches.push(e); });
        }

        if (matches.length === 0) {
          grid.innerHTML = '<div class="empty">No matches</div>';
        } else {
          // Group by category in fixed order, sort items alphabetically within
          const groups = {};
          matches.forEach(item => {
            const cat = getCategoryForItem(item.name);
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(item);
          });
          const catOrder = ["Weapons","Magazines","Ammo","Optics","Attachments","Clothing","Other"];
          catOrder.forEach(cat => {
            if (!groups[cat]) return;
            groups[cat].sort((a, b) => a.name.localeCompare(b.name));
            const header = document.createElement("div");
            header.style.cssText = "grid-column:1/-1;font-size:12px;color:var(--text-dim);margin-top:8px;font-weight:600;";
            header.textContent = cat;
            grid.appendChild(header);
            groups[cat].forEach(item => {
              const btn = document.createElement("button");
              btn.className = "item-btn";
              btn.textContent = itemDisplayName(item);
              styleOutOfStock(btn, item);
              btn.onclick = () => handleBuyItem(item);
              grid.appendChild(btn);
            });
          });
        }
        renderSummary("buy");
        return;
      }

      renderBreadcrumb(buyPath, bc, true);
      let node = buyitems;
      for (const p of buyPath) node = node[p];

      if (Array.isArray(node)) {
        node.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = itemDisplayName(item);
          styleOutOfStock(btn, item);
          btn.onclick = () => handleBuyItem(item);
          grid.appendChild(btn);
        });
      } else {
        Object.keys(node).forEach(key => {
          if (key.startsWith("_")) return;
          const btn = document.createElement("button");
          btn.className = "cat-btn";
          btn.textContent = key;
          btn.onclick = () => {
            if (node[key] && node[key]._outOfStock) {
              toast("OUT OF STOCK");
              return;
            }
            buyPath.push(key);
            render();
          };
          grid.appendChild(btn);
        });
      }
      if (buyPath.length > 0) {
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => { buyPath.pop(); render(); };
        grid.appendChild(back);
      }
      renderSummary("buy");
    }

    function renderSell() {
      const grid = document.getElementById("sellGrid");
      const bc = document.getElementById("sellBreadcrumb");
      grid.innerHTML = "";

      if (searchTerm) {
        bc.innerHTML = '<span>Search results</span>';
        const all = Object.values(sellitems).flat();
        const matches = all.filter(item => item.name.toLowerCase().includes(searchTerm));
        if (matches.length === 0) {
          grid.innerHTML = '<div class="empty">No matches</div>';
        } else {
          matches.forEach(item => {
            const btn = document.createElement("button");
            btn.className = "item-btn";
            btn.textContent = itemDisplayName(item);
            btn.onclick = () => handleSellItem(item);
            grid.appendChild(btn);
          });
        }
        renderSummary("sell");
        return;
      }

      renderBreadcrumb(sellPath, bc, false);

      if (sellPath.length === 0) {
        Object.keys(sellitems).forEach(cat => {
          const btn = document.createElement("button");
          btn.className = "cat-btn";
          btn.textContent = cat;
          btn.onclick = () => { sellPath.push(cat); render(); };
          grid.appendChild(btn);
        });
      } else {
        const cat = sellPath[0];
        const items = sellitems[cat] || [];
        items.forEach(item => {

          btn.className = "item-btn";
          btn.textContent = itemDisplayName(item);
          btn.onclick = () => handleSellItem(item);

        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => { sellPath.pop(); render(); };
        grid.appendChild(back);
      }
      renderSummary("sell");
    }

    function renderSummary(type) {
      const cart = type === "buy" ? buyCart : sellCart;
      const el = document.getElementById(type + "Summary");
      const wrap = document.getElementById(type + "SummaryWrap");
      if (!el || !wrap) return;
      const keys = Object.keys(cart);
      let liveTotal = 0;
      let html = "";
      if (keys.length === 0) {
        html = '<div class="empty">Empty</div>';
      } else {
        keys.forEach(name => {
          const {qty, base, salePrice} = cart[name];
          const isKit = name.startsWith("Player Kit") || name.startsWith("Ghillie Kit");
          let unit = salePrice != null ? salePrice : getDiscountedPrice(name, base);
          let total = (name === "Bible" && type === "sell") ? getBibleTotal(qty) : unit * qty;
          liveTotal += total;
          let priceHtml, nameHtml;
          if (isKit) {
            nameHtml = name;
            priceHtml = base === 0 ? `<s style="opacity:0.5">16000</s> TOKEN` : `${base} Cr`;
          } else {
            nameHtml = `${name} × ${qty}`;
            priceHtml = salePrice != null
              ? `<s style="opacity:0.5">${base * qty}</s> ${Math.round(total)} Cr`
              : `${Math.round(total)} Cr`;
          }
          html += `<div class="summary-item">
            <span class="name">${nameHtml}</span>
            <span class="price">${priceHtml}</span>
            <div class="controls">
              ${isKit ? "" : `<button class="remove-one" data-name="${name}">−</button>`}
              <button class="remove-all" data-name="${name}">×</button>
            </div>
          </div>`;
        });
      }
      el.innerHTML = html;
      const header = wrap.querySelector(".summary-header");
      if (header) header.textContent = keys.length ? `${type === "buy" ? "Buy" : "Sell"} Cart — ${Math.round(liveTotal)} Cr` : `${type === "buy" ? "Buy" : "Sell"} Cart`;
      el.querySelectorAll(".remove-one").forEach(btn => {
        btn.onclick = () => {
          const n = btn.dataset.name;
          if (n.startsWith("Player Kit") || n.startsWith("Ghillie Kit")) {
            kitConfigs = kitConfigs.filter(k => k.name !== n);
            delete cart[n];
            renderKitSummaries();
          } else if (cart[n] && cart[n].qty > 1) cart[n].qty--;
          else delete cart[n];
          saveState();
          renderSummary(type);
        };
      });
      el.querySelectorAll(".remove-all").forEach(btn => {
        btn.onclick = () => {
          const n = btn.dataset.name;
          if (n.startsWith("Player Kit") || n.startsWith("Ghillie Kit")) {
            kitConfigs = kitConfigs.filter(k => k.name !== n);
            renderKitSummaries();
          }
          delete cart[n];
          saveState();
          renderSummary(type);
        };
      });
    }

    function renderRoles() {
      const grid = document.getElementById("rolesGrid");
      grid.innerHTML = "";
      Object.keys(roles).forEach(name => {
        const btn = document.createElement("button");
        btn.className = "role-btn" + (activeRoles.has(name) ? " active" : "");
        btn.textContent = name;
        btn.onclick = () => {
          if (activeRoles.has(name)) activeRoles.delete(name);
          else {
            activeRoles.add(name);
            toast(roles[name].description);
          }
          saveState();
          render();
        };
        grid.appendChild(btn);
      });
    }

    function render() {
      document.getElementById("buyPanel").style.display = currentTab === "buy" ? "block" : "none";
      document.getElementById("sellPanel").style.display = currentTab === "sell" ? "block" : "none";
      document.getElementById("buySummaryWrap").style.display = currentTab === "buy" ? "block" : "none";
      document.getElementById("sellSummaryWrap").style.display = currentTab === "sell" ? "block" : "none";
      if (currentTab === "buy") renderBuy();
      else renderSell();
      renderRoles();
    }

    // ===== ITEM HANDLERS =====
    function addToCart(type, name, qty, base, salePrice) {
      const cart = type === "buy" ? buyCart : sellCart;
      if (name.startsWith("Player Kit") || name.startsWith("Ghillie Kit")) {
        cart[name] = {qty: 1, base, salePrice: salePrice ?? null};
      } else if (cart[name]) {
        cart[name].qty += qty;
      } else {
        cart[name] = {qty, base, salePrice: salePrice ?? null};
      }
      saveState();
      toast(`${qty} x ${name} Added`);
      renderSummary(type);
    }

    function handleBuyItem(item) {
      if (item.name === "Player Kit") {
        openKitPanel(false);
        return;
      }
      if (item.name === "Ghillie Kit") {
        openKitPanel(true);
        return;
      }
      if (item.inStock === false) {
        toast("OUT OF STOCK");
        return;
      }
      if (item.bulkOptions) {
        // show bulk buttons temporarily
        const grid = document.getElementById("buyGrid");
        grid.innerHTML = "";
        item.bulkOptions.forEach(q => {
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = `${item.name} ×${q}`;
          btn.onclick = () => addToCart("buy", item.name, q, item.price, item.salePrice);
          grid.appendChild(btn);
        });
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => render();
        grid.appendChild(back);
        return;
      }
      if (item.name === "IED Complete") {
        addToCart("buy", "IED Container", 1, 3500);
        addToCart("buy", "Plastic Explosives", 2, 18000);
        addToCart("buy", "Detonator", 1, 500);
        toast("LIMITED TIME ONLY");
        return;
      }
      if (item.name === "Trader Truck" || item.name === "Trader Car") {
        toast("OUT OF STOCK");
        return;
      }
      if (item.name === "Ghillie Kit") {
        addToCart("buy", "Ghillie Kit", 1, item.price);
        addToCart("buy", "Ghillie Rifle Wrap", 2, 1000);
        toast("Ghillie Hood and Suit in place of helmet and backpack. Ghillie wraps are sold separately.");
        return;
      }
      addToCart("buy", item.name, 1, item.price, item.salePrice);
    }

    function handleSellItem(item) {
      if (item.bulkOptions) {
        const grid = document.getElementById("sellGrid");
        grid.innerHTML = "";
        item.bulkOptions.forEach(q => {
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = `${item.name} ×${q}`;
          btn.onclick = () => addToCart("sell", item.name, q, item.price);
          grid.appendChild(btn);
        });
        // Role turn-in for certain items
        const roleItems = ["Cannabis","Cigarettes","Syringe","Powdered Milk","Pink Derringer","Compass","Leaf Crown Set","Hockey Stick","Meat Tenderizers","Teddy Bear Set","Books"];
        const peltItems = ["Bear Pelt","Boar Pelt","Wolf Pelt","Deer Pelt","Rabbit Pelt","Dog Pelt"];
        if (roleItems.includes(item.name) || peltItems.includes(item.name)) {
          const rbtn = document.createElement("button");
          rbtn.className = "item-btn role-turnin";
          rbtn.textContent = "Role Turn-In";
          rbtn.onclick = () => doRoleTurnIn(item);
          grid.appendChild(rbtn);
        }
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => render();
        grid.appendChild(back);
        return;
      }
      addToCart("sell", item.name, 1, item.price);
    }

    function doRoleTurnIn(item) {
      const map = {
        "Cannabis": () => addToCart("sell", "Cannabis", 1200, 14),
        "Cigarettes": () => addToCart("sell", "Cigarettes", 250, 135),
        "Syringe": () => addToCart("sell", "Syringe", 100, 900),
        "Powdered Milk": () => addToCart("sell", "Powdered Milk", 50, 1000),
        "Pink Derringer": () => addToCart("sell", "Pink Derringer", 30, 4000),
        "Compass": () => addToCart("sell", "Compass", 50, 500),
        "Set of Leaf Crown": () => addToCart("sell", "Set of Leaf Crown", 4, 1250),
        "Hockey Stick": () => addToCart("sell", "Hockey Stick", 50, 1013),
        "Meat Tenderizers": () => addToCart("sell", "Meat Tenderizers", 50, 405),
        "Set of 4 Teddy Bears": () => addToCart("sell", "Set of 4 Teddy Bears", 5, 2700),
        "Books": () => { addToCart("sell", "Books", 350, 338); addToCart("sell", "Bible", 1, 10000); },
        "Bear Pelt": () => addPelts(),
        "Boar Pelt": () => addPelts(),
        "Wolf Pelt": () => addPelts(),
        "Deer Pelt": () => addPelts(),
        "Rabbit Pelt": () => addPelts()
      };
      if (map[item.name]) {
        map[item.name]();
        toast(roles[Object.keys(roles).find(r => roles[r].bonuses && roles[r].bonuses[item.name])]?.description || "Role turn-in added");
      }
    }

    function addPelts() {
      addToCart("sell", "Bear Pelt", 6, 1000);
      addToCart("sell", "Wolf Pelt", 12, 600);
      addToCart("sell", "Boar Pelt", 6, 600);
      addToCart("sell", "Deer Pelt", 20, 400);
      addToCart("sell", "Rabbit Pelt", 20, 250);
    }

    function calculate() {
      let buyTotal = 0;
      Object.entries(buyCart).forEach(([name, {qty, base, salePrice}]) => {
        const unit = salePrice != null ? salePrice : getDiscountedPrice(name, base);
        buyTotal += unit * qty;
      });
      if (activeRoles.has("Day One")) buyTotal *= 0.9;

      let sellTotal = 0;
      Object.entries(sellCart).forEach(([name, {qty, base}]) => {
        if (name === "Bible") sellTotal += getBibleTotal(qty);
        else sellTotal += getDiscountedPrice(name, base) * qty;
      });

      const fm = activeRoles.has("Day One") ? " (FM)" : "";
      toast(`Buy${fm}: ${Math.round(buyTotal)} Cr\nSell: ${Math.round(sellTotal)} Cr`);
    }

    // ===== INIT =====
    loadState();
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        searchTerm = "";
        document.getElementById("search").value = "";
        render();
      };
    });
    document.getElementById("search").oninput = e => {
      searchTerm = e.target.value.toLowerCase().trim();
      render();
    };
    document.getElementById("calculateBtn").onclick = calculate;
    document.getElementById("clearAllBtn").onclick = () => {
      buyCart = {}; sellCart = {}; kitConfigs = []; saveState(); render();
      renderKitSummaries();
      toast("Carts cleared");
    };
    document.getElementById("clearRolesBtn").onclick = () => {
      activeRoles.clear(); saveState(); render();
      toast("Roles cleared");
    };

    render();
    renderKitSummaries();
  </script>
</body>
</html>
