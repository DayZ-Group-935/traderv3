<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>935 Trading Calculator</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-dim: #a0a0a0;
      --accent: #d96057;
      --accent-hover: #e87a72;
      --green: #4caf50;
      --orange: #ff9800;
      --blue: #64b5f6;
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 12px 16px 8px;
      background: #000;
    }
    .header img {
      width: 100%;
      max-width: 420px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .header a { text-decoration: none; }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-dim);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .content {
      padding: 12px 16px 120px;
      max-width: 480px;
      margin: 0 auto;
    }

    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 12px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--text); }
    .breadcrumb .sep { opacity: 0.4; }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .item-btn, .cat-btn {
      padding: 14px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13.5px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .item-btn:active, .cat-btn:active { transform: scale(0.97); background: #252525; }
    .item-btn.role-turnin { border-color: var(--blue); }

    .summary {
      margin-top: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .summary-header {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .summary-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }
    .summary-item:last-child { border-bottom: none; }
    .summary-item .name { flex: 1; }
    .summary-item .price { color: var(--text-dim); margin: 0 10px; white-space: nowrap; }
    .summary-item .controls { display: flex; gap: 6px; }
    .summary-item button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .remove-one { background: var(--orange); color: #000; }
    .remove-all { background: #e53935; color: #fff; }

    .roles-section {
      margin-top: 20px;
    }
    .roles-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-dim);
    }
    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .role-btn {
      padding: 10px 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 11.5px;
      cursor: pointer;
      text-align: center;
      min-height: 42px;
    }
    .role-btn.active {
      background: #2a3a4a;
      border-color: var(--blue);
      color: var(--blue);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }
    .bottom-bar button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #calculateBtn { background: var(--green); color: #000; }
    #clearAllBtn { background: #e53935; color: #fff; }
    #clearRolesBtn { background: #555; color: #fff; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      max-width: 90%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    .empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 14px; }

    @media (min-width: 600px) {
      .content { max-width: 520px; }
      .item-grid { grid-template-columns: 1fr 1fr 1fr; }
      .roles-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>

    let currentTab = "buy";

    // ===== HELPERS =====
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function getDiscountedPrice(name, base) {
      let price = base;
      activeRoles.forEach(role => {
        const r = roles[role];
        if (r.discounts && r.discounts[name]) {
          price = Math.min(price, base * (1 - r.discounts[name] / 100));
        }
        if (r.bonuses && r.bonuses[name]) {
          price = r.bonuses[name];
        }
      });
      return price;
    }

    function getBibleTotal(qty) {
      if (qty === 1) return 10000;
      if (qty === 2) return 30000;
      if (qty === 3) return 40000;
      if (qty >= 4) return 60000;
      return 10000 * qty;
    }

    function saveState() {
      localStorage.setItem("935calc", JSON.stringify({buyCart, sellCart, activeRoles: [...activeRoles]}));
    }
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem("935calc") || "{}");
        buyCart = s.buyCart || {};
        sellCart = s.sellCart || {};
        activeRoles = new Set(s.activeRoles || []);
      } catch(e) {}
    }

    // ===== RENDER =====
    function renderBreadcrumb(path, el, isBuy) {
      el.innerHTML = "";
      const root = document.createElement("span");
      root.textContent = isBuy ? "Buy" : "Sell";
      root.onclick = () => { if (isBuy) buyPath = []; else sellPath = []; render(); };
      el.appendChild(root);
      path.forEach((p, i) => {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "›";
        el.appendChild(sep);
        const sp = document.createElement("span");
        sp.textContent = p;
        sp.onclick = () => {
          if (isBuy) buyPath = buyPath.slice(0, i+1);
          else sellPath = sellPath.slice(0, i+1);
          render();
        };
        el.appendChild(sp);
      });
    }

    function renderBuy() {
      const grid = document.getElementById("buyGrid");
      const bc = document.getElementById("buyBreadcrumb");
      grid.innerHTML = "";
      renderBreadcrumb(buyPath, bc, true);

      let node = buyitems;
      for (const p of buyPath) node = node[p];

      if (Array.isArray(node)) {
        node.forEach(item => {
          if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return;
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = item.name;
          btn.onclick = () => handleBuyItem(item);
          grid.appendChild(btn);
        });
      } else {
        Object.keys(node).forEach(key => {
          if (searchTerm) return; // categories hide when searching
          const btn = document.createElement("button");
          btn.className = "cat-btn";
          btn.textContent = key;
          btn.onclick = () => { buyPath.push(key); render(); };
          grid.appendChild(btn);
        });
      }
      if (buyPath.length > 0) {
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => { buyPath.pop(); render(); };
        grid.appendChild(back);
      }
      renderSummary("buy");
    }

    function renderSell() {
      const grid = document.getElementById("sellGrid");
      const bc = document.getElementById("sellBreadcrumb");
      grid.innerHTML = "";
      renderBreadcrumb(sellPath, bc, false);

      if (sellPath.length === 0) {
        sellitems.forEach(item => {
          if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return;
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = item.name;
          btn.onclick = () => handleSellItem(item);
          grid.appendChild(btn);
        });
        const peltBtn = document.createElement("button");
        peltBtn.className = "cat-btn";
        peltBtn.textContent = "Pelts";
        peltBtn.onclick = () => { sellPath.push("Pelts"); render(); };
        grid.appendChild(peltBtn);
      } else if (sellPath[0] === "Pelts") {
        pelts.forEach(item => {
          if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return;
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = item.name;
          btn.onclick = () => handleSellItem(item);
          grid.appendChild(btn);
        });
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => { sellPath.pop(); render(); };
        grid.appendChild(back);
      }
      renderSummary("sell");
    }

    function renderSummary(type) {
      const cart = type === "buy" ? buyCart : sellCart;
      const el = document.getElementById(type + "Summary");
      el.innerHTML = "";
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        el.innerHTML = '<div class="empty">Empty</div>';
        return;
      }
      keys.forEach(name => {
        const {qty, base} = cart[name];
        let unit = getDiscountedPrice(name, base);
        let total;
        if (name === "Bible" && type === "sell") {
          total = getBibleTotal(qty);
        } else {
          total = unit * qty;
        }
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerHTML = `
          <span class="name">${name} × ${qty}</span>
          <span class="price">${Math.round(total)} Cr</span>
          <div class="controls">
            <button class="remove-one">−</button>
            <button class="remove-all">×</button>
          </div>`;
        div.querySelector(".remove-one").onclick = () => {
          if (cart[name].qty > 1) cart[name].qty--;
          else delete cart[name];
          saveState(); render();
        };
        div.querySelector(".remove-all").onclick = () => {
          delete cart[name];
          saveState(); render();
        };
        el.appendChild(div);
      });
    }

    function renderRoles() {
      const grid = document.getElementById("rolesGrid");
      grid.innerHTML = "";
      Object.keys(roles).forEach(name => {
        const btn = document.createElement("button");
        btn.className = "role-btn" + (activeRoles.has(name) ? " active" : "");
        btn.textContent = name;
        btn.onclick = () => {
          if (activeRoles.has(name)) activeRoles.delete(name);
          else {
            activeRoles.add(name);
            toast(roles[name].description);
          }
          saveState();
          render();
        };
        grid.appendChild(btn);
      });
    }

    function render() {
      document.getElementById("buyPanel").style.display = currentTab === "buy" ? "block" : "none";
      document.getElementById("sellPanel").style.display = currentTab === "sell" ? "block" : "none";
      if (currentTab === "buy") renderBuy();
      else renderSell();
      renderRoles();
    }

    // ===== ITEM HANDLERS =====
    function addToCart(type, name, qty, base) {
      const cart = type === "buy" ? buyCart : sellCart;
      if (cart[name]) cart[name].qty += qty;
      else cart[name] = {qty, base};
      saveState();
      render();
    }

    function handleBuyItem(item) {
      if (item.bulkOptions) {
        // show bulk buttons temporarily
        const grid = document.getElementById("buyGrid");
        grid.innerHTML = "";
        item.bulkOptions.forEach(q => {
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = `${item.name} ×${q}`;
          btn.onclick = () => addToCart("buy", item.name, q, item.price);
          grid.appendChild(btn);
        });
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => render();
        grid.appendChild(back);
        return;
      }
      if (item.name === "IED Complete") {
        addToCart("buy", "IED Container", 1, 3500);
        addToCart("buy", "Plastic Explosives", 2, 18000);
        addToCart("buy", "Detonator", 1, 500);
        toast("LIMITED TIME ONLY");
        return;
      }
      if (item.name === "Trader Truck") {
        addToCart("buy", "Trader Truck", 1, item.price);
        toast("Trader will deploy at rear of building. Stand clear of drop zone.");
        return;
      }
      if (item.name === "Trader Car") {
        addToCart("buy", "Trader Car", 1, item.price);
        toast("Only sell with admin approval!");
        return;
      }
      if (item.name === "Ghillie Kit") {
        addToCart("buy", "Ghillie Kit", 1, item.price);
        addToCart("buy", "Ghillie Rifle Wrap", 2, 1000);
        toast("Ghillie Hood and Suit in place of helmet and backpack. Ghillie wraps are sold separately.");
        return;
      }
      if (item.name === "Santa Beard") {
        addToCart("buy", "Santa Beard", 1, item.price);
        toast("Only available with player kits - limited time only!");
        return;
      }
      addToCart("buy", item.name, 1, item.price);
    }

    function handleSellItem(item) {
      if (item.bulkOptions) {
        const grid = document.getElementById("sellGrid");
        grid.innerHTML = "";
        item.bulkOptions.forEach(q => {
          const btn = document.createElement("button");
          btn.className = "item-btn";
          btn.textContent = `${item.name} ×${q}`;
          btn.onclick = () => addToCart("sell", item.name, q, item.price);
          grid.appendChild(btn);
        });
        // Role turn-in for certain items
        const roleItems = ["Cannabis","Cigarettes","Syringe","Powdered Milk","Pink Derringer","Compass","Set of Leaf Crown","Hockey Stick","Meat Tenderizers","Set of 4 Teddy Bears","Books"];
        const peltItems = ["Bear Pelt","Boar Pelt","Wolf Pelt","Deer Pelt","Rabbit Pelt"];
        if (roleItems.includes(item.name) || peltItems.includes(item.name)) {
          const rbtn = document.createElement("button");
          rbtn.className = "item-btn role-turnin";
          rbtn.textContent = "Role Turn-In";
          rbtn.onclick = () => doRoleTurnIn(item);
          grid.appendChild(rbtn);
        }
        const back = document.createElement("button");
        back.className = "item-btn";
        back.textContent = "← Back";
        back.style.gridColumn = "1 / -1";
        back.onclick = () => render();
        grid.appendChild(back);
        return;
      }
      addToCart("sell", item.name, 1, item.price);
    }

    function doRoleTurnIn(item) {
      const map = {
        "Cannabis": () => addToCart("sell", "Cannabis", 1200, 14),
        "Cigarettes": () => addToCart("sell", "Cigarettes", 250, 135),
        "Syringe": () => addToCart("sell", "Syringe", 100, 900),
        "Powdered Milk": () => addToCart("sell", "Powdered Milk", 50, 1000),
        "Pink Derringer": () => addToCart("sell", "Pink Derringer", 30, 4000),
        "Compass": () => addToCart("sell", "Compass", 50, 500),
        "Set of Leaf Crown": () => addToCart("sell", "Set of Leaf Crown", 4, 1250),
        "Hockey Stick": () => addToCart("sell", "Hockey Stick", 50, 1013),
        "Meat Tenderizers": () => addToCart("sell", "Meat Tenderizers", 50, 405),
        "Set of 4 Teddy Bears": () => addToCart("sell", "Set of 4 Teddy Bears", 5, 2700),
        "Books": () => { addToCart("sell", "Books", 350, 338); addToCart("sell", "Bible", 1, 10000); },
        "Bear Pelt": () => addPelts(),
        "Boar Pelt": () => addPelts(),
        "Wolf Pelt": () => addPelts(),
        "Deer Pelt": () => addPelts(),
        "Rabbit Pelt": () => addPelts()
      };
      if (map[item.name]) {
        map[item.name]();
        toast(roles[Object.keys(roles).find(r => roles[r].bonuses && roles[r].bonuses[item.name])]?.description || "Role turn-in added");
      }
    }

    function addPelts() {
      addToCart("sell", "Bear Pelt", 6, 1000);
      addToCart("sell", "Wolf Pelt", 12, 600);
      addToCart("sell", "Boar Pelt", 6, 600);
      addToCart("sell", "Deer Pelt", 20, 400);
      addToCart("sell", "Rabbit Pelt", 20, 250);
    }

    function calculate() {
      let buyTotal = 0;
      Object.entries(buyCart).forEach(([name, {qty, base}]) => {
        buyTotal += getDiscountedPrice(name, base) * qty;
      });
      if (activeRoles.has("Day One")) buyTotal *= 0.9;

      let sellTotal = 0;
      Object.entries(sellCart).forEach(([name, {qty, base}]) => {
        if (name === "Bible") sellTotal += getBibleTotal(qty);
        else sellTotal += getDiscountedPrice(name, base) * qty;
      });

      const fm = activeRoles.has("Day One") ? " (FM)" : "";
      toast(`Buy${fm}: ${Math.round(buyTotal)} Cr\nSell: ${Math.round(sellTotal)} Cr`);
    }

    // ===== INIT =====
    loadState();
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        searchTerm = "";
        document.getElementById("search").value = "";
        render();
      };
    });
    document.getElementById("search").oninput = e => {
      searchTerm = e.target.value.toLowerCase().trim();
      render();
    };
    document.getElementById("calculateBtn").onclick = calculate;
    document.getElementById("clearAllBtn").onclick = () => {
      buyCart = {}; sellCart = {}; saveState(); render();
      toast("Carts cleared");
    };
    document.getElementById("clearRolesBtn").onclick = () => {
      activeRoles.clear(); saveState(); render();
      toast("Roles cleared");
    };

    render();
  </script>
</body>
</html>
